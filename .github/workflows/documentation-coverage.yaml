name: Documentation and coverage
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
            any::pkgdown
          needs: website
      - name: Build local documentation and coverage
        shell: Rscript {0}
        run: |
          set.seed(20260512)
          dir.create("output/quality", recursive = TRUE)
          pkgdown::build_site(override = list(destination = "output/quality/site"),
                             new_process = FALSE, preview = FALSE, seed = 20260512L)
          coverage <- covr::package_coverage()
          saveRDS(coverage, "output/quality/coverage.rds")
          write.csv(as.data.frame(coverage), "output/quality/coverage.csv", row.names = FALSE)
          covr::report(coverage, file = "output/quality/coverage.html", browse = FALSE)
          writeLines(c(sprintf("Line coverage: %.2f%%", covr::percent_coverage(coverage)),
                       capture.output(sessionInfo())), "output/quality/sessionInfo.txt")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-documentation-and-coverage
          path: output/quality
          if-no-files-found: error
          retention-days: 14
